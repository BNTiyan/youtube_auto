name: Kids Learning — Daily Video + Short

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  schedule:
    # Generate at 10:30 AM IST; publish regular videos 5 PM IST, Shorts 7 PM IST.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Limit to category (animals/fruits/vegetables/cars/airplanes/brands). Leave blank for auto rotation.'
        required: false
        default: ''
      generate_regular_video:
        description: 'Force regular video generation outside Monday, Wednesday, Friday'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Dry run — generate videos but skip YouTube upload'
        type: boolean
        required: false
        default: false

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: write

# ─── Job ──────────────────────────────────────────────────────────────────────
jobs:
  daily:
    name: Generate & Upload (Video + Short)
    runs-on: [self-hosted, macOS, ARM64, youtube-auto]
    timeout-minutes: 60

    env:
      VIDEO_VISUALS: ai-scenes
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Prepare local video runtime
        uses: ./.github/actions/local-video-runtime

      - name: Decode YouTube credentials
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_KIDS_B64 }}' | base64 -d > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_KIDS_B64 }}'           | base64 -d > youtube_token.json

      # ── 5. Check schedule mode (Three Videos per Week vs Daily Short) ─────────
      - name: Check schedule mode (Three Videos per Week vs Short)
        id: schedule_check
        run: |
          DAY_OF_WEEK=$(TZ=Asia/Kolkata date +%u) # 1=Mon ... 7=Sun
          FORCE_VIDEO="${{ github.event.inputs.generate_regular_video }}"
          # Regular videos run Monday (1), Wednesday (3), Friday (5), or by manual override
          if [ "$FORCE_VIDEO" = "true" ] || [[ "$DAY_OF_WEEK" =~ ^(1|3|5)$ ]]; then
            echo "run_regular_video=true" >> "$GITHUB_OUTPUT"
            echo "run_regular_video=true"
            echo "📅 Monday/Wednesday/Friday or manual override: generating regular video and short."
          else
            echo "run_regular_video=false" >> "$GITHUB_OUTPUT"
            echo "run_regular_video=false"
            echo "📅 Short only today; regular videos run Monday, Wednesday, Friday."
          fi

      # ── 6. Pick today's item (shared by both video + short) ────────────────
      #   Rotates across all 60 kids items (6 categories × 10) by day-of-year.
      #   Running once means regular video and short always cover the same topic.
      - name: Pick today's item
        id: pick
        run: |
          OVERRIDE_CAT="${{ github.event.inputs.category }}"
          if [ -n "$OVERRIDE_CAT" ]; then
            python pick_item.py --config content_config --field fact --category "$OVERRIDE_CAT"
          else
            python pick_item.py --config content_config --field fact
          fi

      # ── 7. Generate regular landscape video (1280×720) ────────────────────
      - name: Generate regular video — ${{ steps.pick.outputs.name }}
        if: ${{ steps.schedule_check.outputs.run_regular_video == 'true' }}
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
        run: |
          mkdir -p videos
          python video_creator.py \
            --item       "$ITEM_NAME" \
            --cat        "$ITEM_CAT"  \
            --config     content_config \
            --output-dir videos

      # ── 8. Generate short portrait video (1080×1920) ──────────────────────
      - name: Generate short — ${{ steps.pick.outputs.name }}
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
          ITEM_TEXT: ${{ steps.pick.outputs.text }}
        run: |
          mkdir -p shorts
          python shorts_creator.py \
            --item       "$ITEM_NAME" \
            --cat        "$ITEM_CAT"  \
            --text       "$ITEM_TEXT" \
            --style      kids \
            --output-dir shorts

      # ── 9. Upload regular video ────────────────────────────────────────────
      - name: Upload regular video to YouTube
        id: upload_video
        if: ${{ github.event.inputs.dry_run != 'true' && steps.schedule_check.outputs.run_regular_video == 'true' }}
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
          ITEM_SLUG: ${{ steps.pick.outputs.slug }}
          ITEM_TITLE: ${{ steps.pick.outputs.title }}
          ITEM_DESC: ${{ steps.pick.outputs.description }}
          ITEM_TAGS: ${{ steps.pick.outputs.tags }}
        run: |
          VIDEO="videos/${ITEM_SLUG}_learning.mp4"
          python youtube_auto.py "$VIDEO" --publish-slot video \
            --topic    "${ITEM_TITLE}" \
            --niche    "Kids Education" \
            --tone     "fun, friendly and educational for young children" \
            --category 27 \
            --privacy  public

      # ── 10. Upload short ───────────────────────────────────────────────────
      #   YouTube auto-detects 1080×1920 portrait videos under 60 sec as Shorts.
      - name: Upload short to YouTube
        id: upload_short
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
          ITEM_SLUG: ${{ steps.pick.outputs.slug }}
          ITEM_TITLE: ${{ steps.pick.outputs.title }}
          ITEM_DESC: ${{ steps.pick.outputs.description }}
          ITEM_TAGS: ${{ steps.pick.outputs.tags }}
        run: |
          VIDEO="shorts/${ITEM_SLUG}_short.mp4"
          python youtube_auto.py "$VIDEO" --publish-slot short \
            --topic    "${ITEM_TITLE} #Shorts" \
            --niche    "Kids Education Shorts" \
            --tone     "fun, friendly and educational for young children. Short vertical video." \
            --category 27 \
            --privacy  public

      # ── 11. Dry-run notice ────────────────────────────────────────────────
      - name: Dry run notice
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "⚠️  Dry run — both videos were generated but NOT uploaded to YouTube."

      # ── 12. Job summary ───────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
          ITEM_SLUG: ${{ steps.pick.outputs.slug }}
        run: |
          if [ -z "$ITEM_SLUG" ]; then
            echo "Pipeline stopped before a topic was selected. No videos were generated or uploaded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "## 🎬 Kids Learning — Daily Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field         | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Category      | \`${ITEM_CAT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item          | **${ITEM_NAME}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Regular video | \`${ITEM_SLUG}_learning.mp4\` (1280×720) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Short         | \`${ITEM_SLUG}_short.mp4\` (1080×1920) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Upload steps | Video: ${{ steps.upload_video.outcome }}; Short: ${{ steps.upload_short.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run date      | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run       | ${{ github.event.inputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"

      # ── 13. Commit state ──────────────────────────────────────────────────
      - name: Commit rotation state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add content_config/.last_config_idx.txt content_config/.pick_state.json || true
          git diff --staged --quiet || git commit -m "chore: update kids pipeline rotation state [skip ci]" || true
          git push || true

      - name: Save video previews and source credits
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kids_pipeline-${{ github.run_id }}
          path: |
            videos/*.mp4
            videos/*_thumb.jpg
            videos/*_visuals.json
            shorts/*.mp4
            shorts/*_script.json
            shorts/*_visuals.json
          retention-days: 7

      - name: Remove temporary YouTube credentials
        if: always()
        shell: bash
        run: rm -f client_secrets.json youtube_token.json
