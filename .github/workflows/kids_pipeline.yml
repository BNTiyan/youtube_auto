name: Kids Learning — Daily Upload

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  schedule:
    # 9:00 AM EST daily  (EST = UTC-5  →  14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch:          # also triggerable manually from GitHub UI
    inputs:
      category:
        description: 'Limit to category (animals/fruits/vegetables/cars/airplanes/brands). Leave blank for auto rotation across all 60 items.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — generate video but skip YouTube upload'
        type: boolean
        required: false
        default: false

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: read            # checkout only — no write-back needed

# ─── Job ──────────────────────────────────────────────────────────────────────
jobs:
  upload:
    name: Generate & Upload
    runs-on: ubuntu-latest
    timeout-minutes: 90     # video generation can take ~30 min for longer clips

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # ── 3. System dependencies (ffmpeg required by moviepy) ────────────────
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      # ── 4. Python dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 5. Decode YouTube credentials from GitHub Secrets ──────────────────
      #   Set these secrets in: GitHub repo → Settings → Secrets → Actions
      #   YOUTUBE_CLIENT_SECRETS_KIDS_B64 : base64 -i client_secrets_kids.json | pbcopy
      #   YOUTUBE_TOKEN_KIDS_B64          : base64 -i youtube_token_kids.json   | pbcopy
      - name: Decode YouTube credentials (Kids account)
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_KIDS_B64 }}' | base64 -d > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_KIDS_B64 }}'           | base64 -d > youtube_token.json

      # ── 6. Pick today's single item ─────────────────────────────────────────
      #   Rotates across all 60 kids items (6 categories × 10) by day-of-year.
      #   Optional category override limits rotation to that category's 10 items.
      #   Outputs: category, name, text, slug, index, total → used in later steps.
      - name: Pick today's item
        id: pick
        run: |
          OVERRIDE_CAT="${{ github.event.inputs.category }}"

          if [ -n "$OVERRIDE_CAT" ]; then
            echo "Category filter: $OVERRIDE_CAT"
            python pick_item.py \
              --config   content_config.json \
              --field    fact \
              --category "$OVERRIDE_CAT"
          else
            python pick_item.py \
              --config content_config.json \
              --field  fact
          fi

      # ── 7. Generate the single-item video ──────────────────────────────────
      - name: Generate video — ${{ steps.pick.outputs.name }}
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
        run: |
          mkdir -p videos
          python video_creator.py \
            --item       "$ITEM_NAME" \
            --cat        "$ITEM_CAT"  \
            --config     content_config.json \
            --output-dir videos

      # ── 8. Upload to YouTube ───────────────────────────────────────────────
      - name: Upload to YouTube
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
          ITEM_SLUG: ${{ steps.pick.outputs.slug }}
        run: |
          VIDEO="videos/${ITEM_SLUG}_learning.mp4"
          CAT_TITLE="${ITEM_CAT^}"    # capitalise first letter (bash 4+)

          python youtube_auto.py "$VIDEO" \
            --topic    "${ITEM_NAME} for Kids — Learn about ${CAT_TITLE}" \
            --niche    "Kids Education" \
            --tone     "fun, friendly and educational for young children" \
            --category 27 \
            --made-for-kids \
            --privacy  public

      # ── 9. Dry-run notice ──────────────────────────────────────────────────
      - name: Dry run notice
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "⚠️  Dry run — video was generated but NOT uploaded to YouTube."

      # ── 10. Summary ────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
          ITEM_SLUG: ${{ steps.pick.outputs.slug }}
        run: |
          echo "## Kids Learning Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field    | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Category | \`${ITEM_CAT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item     | ${ITEM_NAME} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| File     | \`${ITEM_SLUG}_learning.mp4\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run date | $(date '+%Y-%m-%d %H:%M UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run  | ${{ github.event.inputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"
