name: Latest Tech Topic — Daily Video + Short

on:
  schedule:
    # 9:40 AM America/Detroit during EST baseline shown in repo docs
    - cron: '40 14 * * *'
  workflow_dispatch:
    inputs:
      source_topic:
        description: 'Manual topic from Instagram or another source'
        required: false
        default: ''
      channel:
        description: 'Target channel'
        required: false
        type: choice
        options:
          - navadisha
          - childishdreamer
        default: navadisha
      source_text:
        description: 'Main text, caption, or details to turn into a video'
        required: false
        default: ''
      source_notes:
        description: 'Optional notes, caption snippet, or angle to guide the video'
        required: false
        default: ''
      privacy:
        description: 'Upload privacy'
        required: false
        type: choice
        options:
          - private
          - unlisted
          - public
        default: public
      language:
        description: 'Narration language'
        required: false
        type: choice
        options:
          - en
          - te
          - hi
          - en-GB
          - en-AU
        default: en
      source_url:
        description: 'Optional public source URL or feed to use as the primary topic source'
        required: false
        default: ''
      query:
        description: 'Optional news query override for topic discovery'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — generate videos but skip YouTube upload'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  daily:
    name: Generate & Upload (Latest Topic)
    runs-on: [self-hosted, macOS, ARM64, youtube-auto]
    timeout-minutes: 90

    env:
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare local video runtime
        uses: ./.github/actions/local-video-runtime

      - name: Decode YouTube credentials (Tech account)
        if: ${{ github.event.inputs.channel != 'childishdreamer' }}
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_TECH_B64 }}' | base64 -d > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_TECH_B64 }}'           | base64 -d > youtube_token.json

      - name: Decode YouTube credentials (Kids account)
        if: ${{ github.event.inputs.channel == 'childishdreamer' }}
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_KIDS_B64 }}' | base64 -d > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_KIDS_B64 }}'           | base64 -d > youtube_token.json

      - name: Pick today's latest topic
        id: latest
        env:
          CHANNEL_INPUT: ${{ github.event.inputs.channel }}
          SOURCE_TOPIC_INPUT: ${{ github.event.inputs.source_topic }}
          SOURCE_TEXT_INPUT: ${{ github.event.inputs.source_text }}
          SOURCE_NOTES_INPUT: ${{ github.event.inputs.source_notes }}
          LANGUAGE_INPUT: ${{ github.event.inputs.language }}
          SOURCE_URL_INPUT: ${{ github.event.inputs.source_url }}
          QUERY_INPUT: ${{ github.event.inputs.query }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          cmd = ["python", "latest_topic_pipeline.py"]
          mappings = [
              ("CHANNEL_INPUT", "--channel"),
              ("SOURCE_TOPIC_INPUT", "--source-topic"),
              ("SOURCE_TEXT_INPUT", "--source-text"),
              ("SOURCE_NOTES_INPUT", "--source-notes"),
              ("LANGUAGE_INPUT", "--lang"),
              ("SOURCE_URL_INPUT", "--source-url"),
              ("QUERY_INPUT", "--query"),
          ]
          for env_name, flag in mappings:
              value = os.environ.get(env_name, "")
              if value:
                  cmd.extend([flag, value])

          subprocess.run(cmd, check=True)
          PY

      - name: Generate regular video — ${{ steps.latest.outputs.topic_name }}
        if: ${{ github.event.inputs.channel != 'childishdreamer' }}
        env:
          TOPIC_NAME: ${{ steps.latest.outputs.topic_name }}
          TOPIC_CATEGORY: ${{ steps.latest.outputs.topic_category }}
          CONFIG_PATH: ${{ steps.latest.outputs.config_path }}
          LANGUAGE: ${{ steps.latest.outputs.topic_language || github.event.inputs.language || 'en' }}
        run: |
          mkdir -p latest_videos
          python tech_video_creator.py \
            --item "$TOPIC_NAME" \
            --cat "$TOPIC_CATEGORY" \
            --config "$CONFIG_PATH" \
            --output-dir latest_videos \
            --lang "$LANGUAGE"

      - name: Generate regular video for ChildishDreamer — ${{ steps.latest.outputs.topic_name }}
        if: ${{ github.event.inputs.channel == 'childishdreamer' }}
        env:
          TOPIC_NAME: ${{ steps.latest.outputs.topic_name }}
          TOPIC_CATEGORY: ${{ steps.latest.outputs.topic_category }}
          CONFIG_PATH: ${{ steps.latest.outputs.config_path }}
          LANGUAGE: ${{ steps.latest.outputs.topic_language || github.event.inputs.language || 'en' }}
        run: |
          mkdir -p latest_videos
          python video_creator.py \
            --item "$TOPIC_NAME" \
            --cat "$TOPIC_CATEGORY" \
            --config "$CONFIG_PATH" \
            --output-dir latest_videos \
            --lang "$LANGUAGE"

      - name: Generate short — ${{ steps.latest.outputs.topic_name }}
        if: ${{ github.event.inputs.channel != 'childishdreamer' }}
        env:
          TOPIC_NAME: ${{ steps.latest.outputs.topic_name }}
          TOPIC_CATEGORY: ${{ steps.latest.outputs.topic_category }}
          CONFIG_PATH: ${{ steps.latest.outputs.config_path }}
          LANGUAGE: ${{ steps.latest.outputs.topic_language || github.event.inputs.language || 'en' }}
        run: |
          mkdir -p latest_shorts
          python shorts_creator.py \
            --item "$TOPIC_NAME" \
            --cat "$TOPIC_CATEGORY" \
            --config "$CONFIG_PATH" \
            --style tech \
            --output-dir latest_shorts \
            --lang "$LANGUAGE"

      - name: Generate short for ChildishDreamer — ${{ steps.latest.outputs.topic_name }}
        if: ${{ github.event.inputs.channel == 'childishdreamer' }}
        env:
          TOPIC_NAME: ${{ steps.latest.outputs.topic_name }}
          TOPIC_CATEGORY: ${{ steps.latest.outputs.topic_category }}
          CONFIG_PATH: ${{ steps.latest.outputs.config_path }}
          LANGUAGE: ${{ steps.latest.outputs.topic_language || github.event.inputs.language || 'en' }}
        run: |
          mkdir -p latest_shorts
          python shorts_creator.py \
            --item "$TOPIC_NAME" \
            --cat "$TOPIC_CATEGORY" \
            --config "$CONFIG_PATH" \
            --style kids \
            --output-dir latest_shorts \
            --lang "$LANGUAGE"

      - name: Upload short to YouTube
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          TOPIC_NAME: ${{ steps.latest.outputs.topic_name }}
          TOPIC_SLUG: ${{ steps.latest.outputs.topic_slug }}
          TOPIC_HEADLINE: ${{ steps.latest.outputs.topic_headline }}
          PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: |
          if [ "${{ github.event.inputs.channel }}" = "childishdreamer" ]; then
            VIDEO="latest_shorts/${TOPIC_SLUG}_short.mp4"
            python youtube_auto.py "$VIDEO" \
              --topic    "${TOPIC_NAME} #Shorts" \
              --niche    "Kids Education Shorts" \
              --tone     "fun, simple and educational for children. Short vertical video." \
              --category 27 \
              --privacy  "$PRIVACY"
          else
            VIDEO="latest_shorts/${TOPIC_SLUG}_short.mp4"
            python youtube_auto.py "$VIDEO" \
              --topic    "${TOPIC_NAME} #Shorts" \
              --niche    "Latest AI and Technology News Shorts" \
              --tone     "timely, clear and educational for developers. Short vertical video." \
              --category 28 \
              --privacy  "$PRIVACY"
          fi

      - name: Upload regular video for ChildishDreamer
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.channel == 'childishdreamer' }}
        env:
          TOPIC_NAME: ${{ steps.latest.outputs.topic_name }}
          TOPIC_SLUG: ${{ steps.latest.outputs.topic_slug }}
          TOPIC_HEADLINE: ${{ steps.latest.outputs.topic_headline }}
          PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: |
          VIDEO="latest_videos/${TOPIC_SLUG}_learning.mp4"
          python youtube_auto.py "$VIDEO" \
            --topic    "${TOPIC_NAME}" \
            --niche    "Kids Education" \
            --tone     "fun, simple and educational for children" \
            --category 27 \
            --privacy  "$PRIVACY"

      - name: Upload regular video to NavaDisha
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.channel != 'childishdreamer' }}
        env:
          TOPIC_NAME: ${{ steps.latest.outputs.topic_name }}
          TOPIC_SLUG: ${{ steps.latest.outputs.topic_slug }}
          TOPIC_HEADLINE: ${{ steps.latest.outputs.topic_headline }}
          PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: |
          VIDEO="latest_videos/${TOPIC_SLUG}_learning.mp4"
          python youtube_auto.py "$VIDEO" \
            --topic    "${TOPIC_NAME} | ${TOPIC_HEADLINE}" \
            --niche    "Latest AI and Technology News Explained" \
            --tone     "timely, clear and educational for developers and tech enthusiasts" \
            --category 28 \
            --privacy  "$PRIVACY"

      - name: Dry run notice
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "⚠️  Dry run — latest-topic videos were generated but NOT uploaded."

      - name: Write job summary
        if: always()
        env:
          TOPIC_NAME: ${{ steps.latest.outputs.topic_name }}
          TOPIC_SLUG: ${{ steps.latest.outputs.topic_slug }}
          TOPIC_CHANNEL: ${{ github.event.inputs.channel || 'navadisha' }}
          TOPIC_CATEGORY: ${{ steps.latest.outputs.topic_category }}
          TOPIC_LANGUAGE: ${{ steps.latest.outputs.topic_language || github.event.inputs.language || 'en' }}
          TOPIC_HEADLINE: ${{ steps.latest.outputs.topic_headline }}
          TOPIC_SOURCE: ${{ steps.latest.outputs.topic_source }}
          TOPIC_SUMMARY: ${{ steps.latest.outputs.topic_summary }}
          TOPIC_ORIGIN_URL: ${{ steps.latest.outputs.topic_origin_url }}
        run: |
          echo "## 📰 Latest Tech Topic — Daily Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Topic | **${TOPIC_NAME}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Channel | \`${TOPIC_CHANNEL}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Category | \`${TOPIC_CATEGORY}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Headline | ${TOPIC_HEADLINE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source | ${TOPIC_SOURCE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source URL | ${TOPIC_ORIGIN_URL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Summary | ${TOPIC_SUMMARY} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Regular video | \`${TOPIC_SLUG}_learning.mp4\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Short | \`${TOPIC_SLUG}_short.mp4\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Privacy | ${{ github.event.inputs.privacy || 'public' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Language | ${TOPIC_LANGUAGE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run date | $(date '+%Y-%m-%d %H:%M UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | ${{ github.event.inputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Save video previews and source credits
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: latest_topic_pipeline-${{ github.run_id }}
          path: |
            latest_videos/*
            latest_shorts/*
            generated/latest_topic_package.json
          retention-days: 7

      - name: Remove temporary YouTube credentials
        if: always()
        shell: bash
        run: rm -f client_secrets.json youtube_token.json
