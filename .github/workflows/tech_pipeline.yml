name: Tech Learning — Daily Upload

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  schedule:
    # 9:10 AM EST daily  (EST = UTC-5  →  14:10 UTC)
    # Staggered 10 min after kids pipeline to avoid simultaneous API calls
    - cron: '10 14 * * *'
  workflow_dispatch:          # also triggerable manually from GitHub UI
    inputs:
      category:
        description: 'Override category (ai/llm/rag/database/mcp). Leave blank for auto.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — generate video but skip YouTube upload'
        type: boolean
        required: false
        default: false

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: read

# ─── Job ──────────────────────────────────────────────────────────────────────
jobs:
  upload:
    name: Generate & Upload
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # ── 3. System dependencies ─────────────────────────────────────────────
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      # ── 4. Python dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 5. Decode YouTube credentials from GitHub Secrets ──────────────────
      #   Set these secrets in: GitHub repo → Settings → Secrets → Actions
      #   YOUTUBE_CLIENT_SECRETS_TECH_B64 : base64 -i client_secrets_tech.json | pbcopy
      #   YOUTUBE_TOKEN_TECH_B64          : base64 -i youtube_token_tech.json   | pbcopy
      - name: Decode YouTube credentials (Tech account)
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_TECH_B64 }}' | base64 -d > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_TECH_B64 }}'           | base64 -d > youtube_token.json

      # ── 6. Pick today's category ───────────────────────────────────────────
      #   Rotates through all 5 tech categories using day-of-year.
      - name: Select category
        id: pick
        run: |
          OVERRIDE="${{ github.event.inputs.category }}"

          if [ -n "$OVERRIDE" ]; then
            CATEGORY="$OVERRIDE"
            echo "Category overridden to: $CATEGORY"
          else
            CATEGORIES=(ai llm rag database mcp)
            DOY=$(date +%j | sed 's/^0*//')
            INDEX=$(( (DOY - 1) % ${#CATEGORIES[@]} ))
            CATEGORY="${CATEGORIES[$INDEX]}"
            echo "Day $DOY → index $INDEX → category: $CATEGORY"
          fi

          # Derive topic string for Gemini metadata generation
          case "$CATEGORY" in
            ai)       TOPIC="Artificial Intelligence Explained — Key AI Concepts for Beginners" ;;
            llm)      TOPIC="Large Language Models Explained — How LLMs and ChatGPT Work" ;;
            rag)      TOPIC="Retrieval Augmented Generation (RAG) Explained — AI + Search" ;;
            database) TOPIC="Database Systems Explained — SQL NoSQL and Vector Databases" ;;
            mcp)      TOPIC="Model Context Protocol (MCP) Explained — Connect AI to Any Tool" ;;
            *)        TOPIC="${CATEGORY^^} Concepts Explained" ;;
          esac

          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "topic=$TOPIC"       >> "$GITHUB_OUTPUT"

      # ── 7. Generate the video ──────────────────────────────────────────────
      - name: Generate video — ${{ steps.pick.outputs.category }}
        run: |
          mkdir -p tech_videos
          python tech_video_creator.py "${{ steps.pick.outputs.category }}" \
            --config tech_content_config.json \
            --output-dir tech_videos

      # ── 8. Upload to YouTube ───────────────────────────────────────────────
      - name: Upload to YouTube
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          CATEGORY="${{ steps.pick.outputs.category }}"
          VIDEO="tech_videos/${CATEGORY}_learning.mp4"

          python youtube_auto.py "$VIDEO" \
            --topic    "${{ steps.pick.outputs.topic }}" \
            --niche    "Technology and AI Education" \
            --tone     "clear, professional and educational for developers and tech enthusiasts" \
            --category 28 \
            --privacy  public

      # ── 9. Dry-run notice ──────────────────────────────────────────────────
      - name: Dry run notice
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "⚠️  Dry run — video was generated but NOT uploaded to YouTube."

      # ── 10. Summary ────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## Tech Learning Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Category | \`${{ steps.pick.outputs.category }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Topic    | ${{ steps.pick.outputs.topic }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run date | $(date '+%Y-%m-%d %H:%M UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run  | ${{ github.event.inputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"
