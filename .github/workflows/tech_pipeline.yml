name: Tech Learning — Daily Upload

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  schedule:
    # 9:10 AM EST daily  (EST = UTC-5  →  14:10 UTC)
    # Staggered 10 min after kids pipeline to avoid simultaneous API calls
    - cron: '10 14 * * *'
  workflow_dispatch:          # also triggerable manually from GitHub UI
    inputs:
      category:
        description: 'Limit to category (ai/llm/rag/database/mcp). Leave blank for auto rotation across all 50 concepts.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — generate video but skip YouTube upload'
        type: boolean
        required: false
        default: false

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: read

# ─── Job ──────────────────────────────────────────────────────────────────────
jobs:
  upload:
    name: Generate & Upload
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # ── 3. System dependencies ─────────────────────────────────────────────
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      # ── 4. Python dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 5. Decode YouTube credentials from GitHub Secrets ──────────────────
      #   Set these secrets in: GitHub repo → Settings → Secrets → Actions
      #   YOUTUBE_CLIENT_SECRETS_TECH_B64 : base64 -i client_secrets_tech.json | pbcopy
      #   YOUTUBE_TOKEN_TECH_B64          : base64 -i youtube_token_tech.json   | pbcopy
      - name: Decode YouTube credentials (Tech account)
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_TECH_B64 }}' | base64 -d > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_TECH_B64 }}'           | base64 -d > youtube_token.json

      # ── 6. Pick today's single concept ──────────────────────────────────────
      #   Rotates across all 50 tech concepts (5 categories × 10) by day-of-year.
      #   Optional category override limits rotation to that category's 10 items.
      #   Outputs: category, name, text, slug, index, total → used in later steps.
      - name: Pick today's concept
        id: pick
        run: |
          OVERRIDE_CAT="${{ github.event.inputs.category }}"

          if [ -n "$OVERRIDE_CAT" ]; then
            echo "Category filter: $OVERRIDE_CAT"
            python pick_item.py \
              --config   tech_content_config.json \
              --field    explanation \
              --category "$OVERRIDE_CAT"
          else
            python pick_item.py \
              --config tech_content_config.json \
              --field  explanation
          fi

      # ── 7. Generate the single-concept video ──────────────────────────────
      - name: Generate video — ${{ steps.pick.outputs.name }}
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
        run: |
          mkdir -p tech_videos
          python tech_video_creator.py \
            --item       "$ITEM_NAME" \
            --cat        "$ITEM_CAT"  \
            --config     tech_content_config.json \
            --output-dir tech_videos

      # ── 8. Upload to YouTube ───────────────────────────────────────────────
      - name: Upload to YouTube
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
          ITEM_SLUG: ${{ steps.pick.outputs.slug }}
        run: |
          VIDEO="tech_videos/${ITEM_SLUG}_learning.mp4"
          ITEM_CAT_UPPER="${ITEM_CAT^^}"    # uppercase (bash 4+)

          python youtube_auto.py "$VIDEO" \
            --topic    "${ITEM_NAME} Explained — ${ITEM_CAT_UPPER} Concepts" \
            --niche    "Technology and AI Education" \
            --tone     "clear, professional and educational for developers and tech enthusiasts" \
            --category 28 \
            --privacy  public

      # ── 9. Dry-run notice ──────────────────────────────────────────────────
      - name: Dry run notice
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "⚠️  Dry run — video was generated but NOT uploaded to YouTube."

      # ── 10. Summary ────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
          ITEM_SLUG: ${{ steps.pick.outputs.slug }}
        run: |
          echo "## Tech Learning Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field    | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Category | \`${ITEM_CAT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Concept  | ${ITEM_NAME} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| File     | \`${ITEM_SLUG}_learning.mp4\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run date | $(date '+%Y-%m-%d %H:%M UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run  | ${{ github.event.inputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"
