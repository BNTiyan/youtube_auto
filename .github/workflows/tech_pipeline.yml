name: Tech Learning — Daily Video + Short

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  schedule:
    # 9:20 AM EST daily  (EST = UTC-5  →  14:20 UTC)
    # Staggered 20 min after kids pipeline to avoid simultaneous API calls
    - cron: '20 14 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Limit to category (ai/llm/rag/database/mcp). Leave blank for auto rotation.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — generate videos but skip YouTube upload'
        type: boolean
        required: false
        default: false

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: write

# ─── Job ──────────────────────────────────────────────────────────────────────
jobs:
  daily:
    name: Generate & Upload (Video + Short)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # ── 3. System dependencies ─────────────────────────────────────────────
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ── 4. Python dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 5. Decode YouTube credentials (Tech account) ───────────────────────
      - name: Decode YouTube credentials
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_TECH_B64 }}' | base64 -d > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_TECH_B64 }}'           | base64 -d > youtube_token.json

      # ── 6. Pick today's concept (shared by both video + short) ─────────────
      #   Rotates across all 50 tech concepts (5 categories × 10) by day-of-year.
      - name: Pick today's concept
        id: pick
        run: |
          OVERRIDE_CAT="${{ github.event.inputs.category }}"
          if [ -n "$OVERRIDE_CAT" ]; then
            python pick_item.py --config tech_content_config --field explanation --category "$OVERRIDE_CAT"
          else
            python pick_item.py --config tech_content_config --field explanation
          fi

      # ── 7. Generate regular landscape video (1280×720) ────────────────────
      - name: Generate regular video — ${{ steps.pick.outputs.name }}
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
        run: |
          mkdir -p tech_videos
          python tech_video_creator.py \
            --item       "$ITEM_NAME" \
            --cat        "$ITEM_CAT"  \
            --config     tech_content_config \
            --output-dir tech_videos

      # ── 8. Generate short portrait video (1080×1920) ──────────────────────
      - name: Generate short — ${{ steps.pick.outputs.name }}
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
          ITEM_TEXT: ${{ steps.pick.outputs.text }}
        run: |
          mkdir -p tech_shorts
          python shorts_creator.py \
            --item       "$ITEM_NAME" \
            --cat        "$ITEM_CAT"  \
            --text       "$ITEM_TEXT" \
            --style      tech \
            --output-dir tech_shorts

      # ── 9. Upload regular video ────────────────────────────────────────────
      - name: Upload regular video to YouTube
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
          ITEM_SLUG: ${{ steps.pick.outputs.slug }}
          ITEM_TITLE: ${{ steps.pick.outputs.title }}
          ITEM_DESC: ${{ steps.pick.outputs.description }}
          ITEM_TAGS: ${{ steps.pick.outputs.tags }}
        run: |
          VIDEO="tech_videos/${ITEM_SLUG}_learning.mp4"
          ITEM_CAT_UPPER="${ITEM_CAT^^}"
          python youtube_auto.py "$VIDEO" \
            --topic    "${ITEM_TITLE}" \
            --niche    "Technology and AI Education" \
            --tone     "clear, professional and educational for developers and tech enthusiasts" \
            --category 28 \
            --privacy  public

      # ── 10. Upload short ───────────────────────────────────────────────────
      #   YouTube auto-detects 1080×1920 portrait videos under 60 sec as Shorts.
      - name: Upload short to YouTube
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
          ITEM_SLUG: ${{ steps.pick.outputs.slug }}
          ITEM_TITLE: ${{ steps.pick.outputs.title }}
          ITEM_DESC: ${{ steps.pick.outputs.description }}
          ITEM_TAGS: ${{ steps.pick.outputs.tags }}
        run: |
          VIDEO="tech_shorts/${ITEM_SLUG}_short.mp4"
          ITEM_CAT_UPPER="${ITEM_CAT^^}"
          python youtube_auto.py "$VIDEO" \
            --topic    "${ITEM_TITLE} #Shorts" \
            --niche    "Technology and AI Education Shorts" \
            --tone     "clear, professional and educational for developers. Short vertical video." \
            --category 28 \
            --privacy  public

      # ── 11. Dry-run notice ────────────────────────────────────────────────
      - name: Dry run notice
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "⚠️  Dry run — both videos were generated but NOT uploaded to YouTube."

      # ── 12. Job summary ───────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        env:
          ITEM_NAME: ${{ steps.pick.outputs.name }}
          ITEM_CAT:  ${{ steps.pick.outputs.category }}
          ITEM_SLUG: ${{ steps.pick.outputs.slug }}
        run: |
          echo "## 💻 Tech Learning — Daily Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field         | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Category      | \`${ITEM_CAT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Concept       | **${ITEM_NAME}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Regular video | \`${ITEM_SLUG}_learning.mp4\` (1280×720) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Short         | \`${ITEM_SLUG}_short.mp4\` (1080×1920) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Uploads today | 2 (video + short) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run date      | $(date '+%Y-%m-%d %H:%M UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run       | ${{ github.event.inputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"

      # ── 13. Commit state ──────────────────────────────────────────────────
      - name: Commit rotation state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add tech_content_config/.last_config_idx.txt tech_content_config/.pick_state.json || true
          git diff --staged --quiet || git commit -m "chore: update tech pipeline rotation state [skip ci]" || true
          git push || true
