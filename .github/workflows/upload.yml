name: YouTube Video Uploader

on:
  workflow_dispatch:
    inputs:
      video_path:
        description: 'Path to video file or directory'
        required: true
        type: string
        default: 'videos/'
      topic:
        description: 'Video Topic'
        required: true
        type: string
        default: 'General'
      niche:
        description: 'Channel Niche'
        required: false
        type: string
        default: 'General'
      tone:
        description: 'Video Tone'
        required: false
        type: string
        default: 'engaging and informative'
      privacy:
        description: 'Privacy status (public, private, unlisted)'
        required: false
        type: choice
        options:
          - public
          - private
          - unlisted
        default: 'private'

jobs:
  upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials
        env:
          CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_KIDS_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_KIDS_B64 }}
        run: |
          echo "$CLIENT_SECRETS_B64" | base64 --decode > client_secrets.json
          echo "$YOUTUBE_TOKEN_B64" | base64 --decode > youtube_token.json

      - name: Run Auto-Uploader
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python youtube_auto.py "${{ github.event.inputs.video_path }}" \
            --topic "${{ github.event.inputs.topic }}" \
            --niche "${{ github.event.inputs.niche }}" \
            --tone "${{ github.event.inputs.tone }}" \
            --privacy ${{ github.event.inputs.privacy }}
