name: YouTube Video Uploader

on:
  workflow_dispatch:
    inputs:
      video_path:
        description: 'Path to video file or directory'
        required: true
        type: string
        default: 'videos/'
      topic:
        description: 'Video Topic'
        required: true
        type: string
        default: 'General'
      niche:
        description: 'Channel Niche'
        required: false
        type: string
        default: 'General'
      tone:
        description: 'Video Tone'
        required: false
        type: string
        default: 'engaging and informative'
      privacy:
        description: 'Privacy status (public, private, unlisted)'
        required: false
        type: choice
        options:
          - public
          - private
          - unlisted
        default: 'private'

jobs:
  upload:
    runs-on: [self-hosted, macOS, ARM64, youtube-auto]

    env:
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_BASE_URL: http://127.0.0.1:11434
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare local video runtime
        uses: ./.github/actions/local-video-runtime

      - name: Setup Credentials
        env:
          CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_KIDS_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_KIDS_B64 }}
        run: |
          echo "$CLIENT_SECRETS_B64" | base64 -d > client_secrets.json
          echo "$YOUTUBE_TOKEN_B64" | base64 -d > youtube_token.json

      - name: Run Auto-Uploader
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python youtube_auto.py "${{ github.event.inputs.video_path }}" \
            --topic "${{ github.event.inputs.topic }}" \
            --niche "${{ github.event.inputs.niche }}" \
            --tone "${{ github.event.inputs.tone }}" \
            --privacy ${{ github.event.inputs.privacy }}

      - name: Remove temporary YouTube credentials
        if: always()
        shell: bash
        run: rm -f client_secrets.json youtube_token.json
