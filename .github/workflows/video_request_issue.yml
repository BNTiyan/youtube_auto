name: Video Request from GitHub Page

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write

jobs:
  authorize:
    if: contains(github.event.issue.labels.*.name, 'video-request')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.permission.outputs.result }}
    steps:
      - name: Check request approval
        id: permission
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            // Check the actor who caused this event, not the issue author's association.
            // A public user's edits must not re-run a previously approved request.
            try {
              const {data} = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });
              return ['admin', 'maintain', 'write'].includes(data.permission) ? 'true' : 'false';
            } catch (error) {
              if (error.status === 404) return 'false';
              throw error;
            }

  build:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: [self-hosted, macOS, ARM64, youtube-auto]
    timeout-minutes: 90

    env:
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare local video runtime
        uses: ./.github/actions/local-video-runtime

      - name: Parse request issue
        id: request
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json, os, re

          def extract(body: str, heading: str) -> str:
              pattern = rf"## {re.escape(heading)}\n(.*?)(?=\n## |\Z)"
              match = re.search(pattern, body, flags=re.S)
              return match.group(1).strip() if match else ""

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as fh:
              event = json.load(fh)

          issue = event["issue"]
          body = issue.get("body", "")
          topic = extract(body, "Topic")
          source_text = extract(body, "Source Text")
          notes = extract(body, "Notes")
          privacy = extract(body, "Privacy").lower() or "public"
          dry_run_raw = extract(body, "Dry Run").lower()
          dry_run = "true" if "true" in dry_run_raw or "yes" in dry_run_raw else "false"

          if privacy not in {"public", "private", "unlisted"}:
              raise SystemExit("Privacy must be public, private, or unlisted.")

          if not topic:
              raise SystemExit("Topic is required in the issue body.")

          outputs = {
              "topic": topic.replace("\n", " "),
              "source_text": source_text.replace("\n", " ").strip(),
              "notes": notes.replace("\n", " ").strip(),
              "privacy": privacy,
              "dry_run": dry_run,
              "issue_number": str(issue["number"]),
              "issue_title": issue["title"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for key, value in outputs.items():
                  fh.write(f"{key}={value}\n")
          PY

      - name: Decode YouTube credentials (Tech account)
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_TECH_B64 }}' | base64 -d > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_TECH_B64 }}'           | base64 -d > youtube_token.json

      - name: Acknowledge request
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "Starting video generation for this request. I’ll post an update here when the run finishes."
            });

      - name: Build topic package
        id: package
        env:
          REQUEST_TOPIC: ${{ steps.request.outputs.topic }}
          REQUEST_SOURCE_TEXT: ${{ steps.request.outputs.source_text }}
          REQUEST_NOTES: ${{ steps.request.outputs.notes }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          cmd = [
              "python",
              "latest_topic_pipeline.py",
              "--source-topic", os.environ["REQUEST_TOPIC"],
              "--source-text", os.environ.get("REQUEST_SOURCE_TEXT", ""),
              "--source-notes", os.environ.get("REQUEST_NOTES", ""),
          ]
          subprocess.run(cmd, check=True)
          PY

      - name: Generate regular video
        env:
          TOPIC_NAME: ${{ steps.package.outputs.topic_name }}
          TOPIC_CATEGORY: ${{ steps.package.outputs.topic_category }}
          CONFIG_PATH: ${{ steps.package.outputs.config_path }}
        run: |
          mkdir -p latest_videos
          python tech_video_creator.py \
            --item "$TOPIC_NAME" \
            --cat "$TOPIC_CATEGORY" \
            --config "$CONFIG_PATH" \
            --output-dir latest_videos

      - name: Generate short
        env:
          TOPIC_NAME: ${{ steps.package.outputs.topic_name }}
          TOPIC_CATEGORY: ${{ steps.package.outputs.topic_category }}
          CONFIG_PATH: ${{ steps.package.outputs.config_path }}
        run: |
          mkdir -p latest_shorts
          python shorts_creator.py \
            --item "$TOPIC_NAME" \
            --cat "$TOPIC_CATEGORY" \
            --config "$CONFIG_PATH" \
            --style tech \
            --output-dir latest_shorts

      - name: Upload regular video
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        env:
          TOPIC_NAME: ${{ steps.package.outputs.topic_name }}
          TOPIC_SLUG: ${{ steps.package.outputs.topic_slug }}
          TOPIC_HEADLINE: ${{ steps.package.outputs.topic_headline }}
          PRIVACY: ${{ steps.request.outputs.privacy }}
        run: |
          VIDEO="latest_videos/${TOPIC_SLUG}_learning.mp4"
          python youtube_auto.py "$VIDEO" \
            --topic    "${TOPIC_NAME} | ${TOPIC_HEADLINE}" \
            --niche    "Latest AI and Technology News Explained" \
            --tone     "timely, clear and educational for developers and tech enthusiasts" \
            --category 28 \
            --privacy  "$PRIVACY"

      - name: Upload short
        if: ${{ steps.request.outputs.dry_run != 'true' }}
        env:
          TOPIC_NAME: ${{ steps.package.outputs.topic_name }}
          TOPIC_SLUG: ${{ steps.package.outputs.topic_slug }}
          PRIVACY: ${{ steps.request.outputs.privacy }}
        run: |
          VIDEO="latest_shorts/${TOPIC_SLUG}_short.mp4"
          python youtube_auto.py "$VIDEO" \
            --topic    "${TOPIC_NAME} #Shorts" \
            --niche    "Latest AI and Technology News Shorts" \
            --tone     "timely, clear and educational for developers. Short vertical video." \
            --category 28 \
            --privacy  "$PRIVACY"

      - name: Save generated videos for review
        uses: actions/upload-artifact@v4
        with:
          name: request-${{ github.event.issue.number }}-${{ github.run_id }}
          path: |
            latest_videos/*.mp4
            latest_shorts/*.mp4
            latest_shorts/*_script.json
            generated/latest_topic_package.json
          retention-days: 7

      - name: Comment success
        if: success()
        env:
          REQUEST_DRY_RUN: ${{ steps.request.outputs.dry_run }}
          REQUEST_PRIVACY: ${{ steps.request.outputs.privacy }}
          REQUEST_TOPIC: ${{ steps.package.outputs.topic_name }}
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const dryRun = process.env.REQUEST_DRY_RUN === "true";
            const privacy = process.env.REQUEST_PRIVACY;
            const topic = process.env.REQUEST_TOPIC;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = dryRun
              ? `Dry run finished for **${topic}**.\n\nFiles were generated but not uploaded.\n\nRun details: ${runUrl}`
              : `Video generation finished for **${topic}**.\n\nUploads were sent with **${privacy}** privacy.\n\nRun details: ${runUrl}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });

      - name: Comment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `The request failed during processing.\n\nCheck the workflow run for details: ${runUrl}`
            });

      - name: Remove temporary YouTube credentials
        if: always()
        shell: bash
        run: rm -f client_secrets.json youtube_token.json
